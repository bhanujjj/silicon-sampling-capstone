[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silicon-sampling-india"
version = "0.1.0"
description = "Silicon sampling fidelity audit for Indian survey respondents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Bhanuj Bhalla", email = "bhanujbhalla17@gmail.com"}
]
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0",
    "pyarrow>=13.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "transformers>=4.35",
    "torch>=2.1",
    "peft>=0.7",
    "trl>=0.7",
    "google-generativeai>=0.3",
    "plotly>=5.17",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pydantic>=2.0",
    "pypdf>=4.0",  # parses the WVS-7 codebook PDF into item metadata
    "requests>=2.28",  # src/inference/groq.py calls Groq's REST API directly
]

[tool.hatch.build.targets.wheel]
# hatchling can't infer what to ship from a name/directory mismatch: the
# package name below is "silicon-sampling-india" but the actual code lives
# in src/ as a set of top-level modules (config.py, data/, eval/, ...), not
# a src/silicon_sampling_india/ directory. This was causing `uv sync` to
# fail outright with "unable to determine which files to ship".
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.11",
    "ruff>=0.1",
    "mypy>=1.7",
    "ipython>=8.16",
    "jupyter>=1.0",
]
kaggle = [
    "kaggle>=1.5",
]

[tool.uv]
python-version = "3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
